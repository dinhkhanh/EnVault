name = "evault-store"
main = "src/index.ts"
# Account that owns the dinhkhanh.dk zone (Tran@dinhkhanh.dk's Account).
account_id = "d87d194717900d3e8e1c5a9ee68f59ac"
compatibility_date = "2026-10-01"
# Custom domain; until it is attached the workers.dev URL from `wrangler deploy` works too.
routes = [{ pattern = "store.evault.dinhkhanh.dk", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "evault-store"
database_id = "df3eae6c-9d89-4cd2-8313-8db53cae2334"

[vars]
# Public half of the license signing key; must match App/LicensePublicKey.swift.
LICENSE_PUBLIC_KEY = "Oh6BDufPhc5jL0Xt6jLrt+nIexZSqmbhqs4uNN0UBLc="
SITE_URL = "https://dinhkhanh.github.io/eVault/"
# Polar checkout link for eVault Pro (dashboard > Checkout Links). /buy redirects here.
POLAR_CHECKOUT_URL = ""
# Paddle fallback: a Paddle checkout URL. Only used when CHECKOUT_PROVIDER = "paddle".
PADDLE_CHECKOUT_URL = ""
CHECKOUT_PROVIDER = "polar"
# Resend sender; the domain must be verified in Resend.
FROM_EMAIL = "eVault <evault@updates.dinhkhanh.dk>"
SUPPORT_EMAIL = "tran@dinhkhanh.dk"
UPDATES_MONTHS = "12"
# "resend" sends real mail; "log" prints to the worker log (local dev).
MAIL_MODE = "resend"

# Secrets (wrangler secret put NAME):
#   LICENSE_PRIVATE_KEY   base64 Ed25519 seed from the keychain item dk.dinhkhanh.evault.license-signing
#   POLAR_WEBHOOK_SECRET  whsec_... from the Polar endpoint
#   PADDLE_WEBHOOK_SECRET pdl_ntfset_... from the Paddle notification destination (fallback only)
#   RESEND_API_KEY        re_...
#   ADMIN_TOKEN           long random string for /admin/*
