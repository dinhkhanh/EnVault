name: EnVault
options:
  bundleIdPrefix: dk.dinhkhanh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
  Debug-iCloud: debug
  Release-iCloud: release
packages:
  EnVaultKit:
    path: Packages/EnVaultKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
targets:
  EnVault:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: EnVaultKit
        product: VaultCore
      - package: EnVaultKit
        product: EnvKit
      - package: EnVaultKit
        product: VaultSync
      - package: EnVaultKit
        product: ToolKit
      - package: EnVaultKit
        product: LicenseKit
      - package: Sparkle
        product: Sparkle
      # The `envault` CLI ships inside the app; Settings links it into PATH. Not in Contents/MacOS:
      # on a case-insensitive disk `envault` would overwrite the app's own `EnVault` executable.
      - target: envault-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    configFiles:
      Debug-iCloud: Config/Signing.xcconfig
      Release-iCloud: Config/Signing.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EnVault
        CFBundleName: EnVault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Dinh Khanh"
        NSFaceIDUsageDescription: "EnVault uses Touch ID to unlock your vault."
        SUFeedURL: https://github.com/dinhkhanh/EnVault/releases/latest/download/appcast.xml
        SUPublicEDKey: SRLHhBqtlIsBvuqpk/ONBFaAS629idQVYwoebgfGd/E=
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
        SUScheduledCheckInterval: 86400
        EVReleaseDate: $(ENVAULT_RELEASE_DATE)
        # Lets the app receive CloudKit share links; release builds explain that Team isn't out yet (AppDelegate).
        CKSharingSupported: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.dinhkhanh.envault
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 23
        # Date this version shipped; licenses whose updatesUntil is earlier run as Free on this build.
        ENVAULT_RELEASE_DATE: "2026-10-20"
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: false
        DEAD_CODE_STRIPPING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Unsigned local builds: folder sync only, no iCloud entitlements.
        CODE_SIGN_ENTITLEMENTS: App/EnVault.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
      configs:
        # Signed builds: iCloud/CloudKit + push entitlements. Team id comes from Config/Signing.xcconfig.
        Debug-iCloud:
          CODE_SIGN_ENTITLEMENTS: App/EnVault-iCloud.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(ENVAULT_TEAM_ID)"
          ENVAULT_APS_ENVIRONMENT: development
        Release-iCloud:
          CODE_SIGN_ENTITLEMENTS: App/EnVault-iCloud.entitlements
          CODE_SIGN_STYLE: Automatic
          # Automatic signing archives with Apple Development; the export (method developer-id) re-signs with Developer ID.
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(ENVAULT_TEAM_ID)"
          ENVAULT_APS_ENVIRONMENT: production
  # Named envault-cli, not envault: the case-insensitive disk would merge its build folders with EnVault's.
  envault-cli:
    type: tool
    platform: macOS
    sources:
      - path: Packages/EnVaultKit/Sources/envault
    dependencies:
      - package: EnVaultKit
        product: VaultCore
      - package: EnVaultKit
        product: EnvKit
      - package: EnVaultKit
        product: LicenseKit
    configFiles:
      Debug-iCloud: Config/Signing.xcconfig
      Release-iCloud: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: envault
        PRODUCT_BUNDLE_IDENTIFIER: dk.dinhkhanh.envault.cli
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
        DEAD_CODE_STRIPPING: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # An embedded Info.plist gives the tool a stable signing identifier. No sandbox, no entitlements.
        CREATE_INFOPLIST_SECTION_IN_BINARY: true
        GENERATE_INFOPLIST_FILE: true
      configs:
        Debug-iCloud:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(ENVAULT_TEAM_ID)"
        Release-iCloud:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(ENVAULT_TEAM_ID)"
schemes:
  EnVault:
    build:
      targets:
        EnVault: all
    run:
      config: Debug
  EnVault-iCloud:
    build:
      targets:
        EnVault: all
    run:
      config: Debug-iCloud
    archive:
      config: Release-iCloud
