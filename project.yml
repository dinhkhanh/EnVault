name: eVault
options:
  bundleIdPrefix: dk.dinhkhanh
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
  Debug-iCloud: debug
  Release-iCloud: release
packages:
  eVaultKit:
    path: Packages/eVaultKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
targets:
  eVault:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: eVaultKit
        product: VaultCore
      - package: eVaultKit
        product: EnvKit
      - package: eVaultKit
        product: VaultSync
      - package: eVaultKit
        product: ToolKit
      - package: eVaultKit
        product: LicenseKit
      - package: Sparkle
        product: Sparkle
    configFiles:
      Debug-iCloud: Config/Signing.xcconfig
      Release-iCloud: Config/Signing.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: eVault
        CFBundleName: eVault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Dinh Khanh"
        NSFaceIDUsageDescription: "eVault uses Touch ID to unlock your vault."
        SUFeedURL: https://github.com/dinhkhanh/eVault/releases/latest/download/appcast.xml
        SUPublicEDKey: /DQqNs5Xtctf7m5I8HsyCCxdg58izjlM+N+Yxnhffc4=
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
        SUScheduledCheckInterval: 86400
        EVReleaseDate: $(EVAULT_RELEASE_DATE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.dinhkhanh.evault
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 5
        # Date this version shipped; licenses whose updatesUntil is earlier run as Free on this build.
        EVAULT_RELEASE_DATE: "2026-10-15"
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: false
        DEAD_CODE_STRIPPING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Unsigned local builds: folder sync only, no iCloud entitlements.
        CODE_SIGN_ENTITLEMENTS: App/eVault.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
      configs:
        # Signed builds: iCloud/CloudKit + push entitlements. Team id comes from Config/Signing.xcconfig.
        Debug-iCloud:
          CODE_SIGN_ENTITLEMENTS: App/eVault-iCloud.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(EVAULT_TEAM_ID)"
          EVAULT_APS_ENVIRONMENT: development
        Release-iCloud:
          CODE_SIGN_ENTITLEMENTS: App/eVault-iCloud.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "$(EVAULT_TEAM_ID)"
          EVAULT_APS_ENVIRONMENT: production
schemes:
  eVault:
    build:
      targets:
        eVault: all
    run:
      config: Debug
  eVault-iCloud:
    build:
      targets:
        eVault: all
    run:
      config: Debug-iCloud
    archive:
      config: Release-iCloud
