name: eVault
options:
  bundleIdPrefix: dk.dinhkhanh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
  Debug-iCloud: debug
  Release-iCloud: release
packages:
  eVaultKit:
    path: Packages/eVaultKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
targets:
  eVault:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: eVaultKit
        product: VaultCore
      - package: eVaultKit
        product: EnvKit
      - package: eVaultKit
        product: VaultSync
      - package: eVaultKit
        product: ToolKit
      - package: eVaultKit
        product: LicenseKit
      - package: Sparkle
        product: Sparkle
      # The `evault` CLI ships inside the app; Settings links it into PATH. Not in Contents/MacOS:
      # on a case-insensitive disk `evault` would overwrite the app's own `eVault` executable.
      - target: evault-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    configFiles:
      Debug-iCloud: Config/Signing.xcconfig
      Release-iCloud: Config/Signing.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: eVault
        CFBundleName: eVault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Dinh Khanh"
        NSFaceIDUsageDescription: "eVault uses Touch ID to unlock your vault."
        SUFeedURL: https://github.com/dinhkhanh/eVault/releases/latest/download/appcast.xml
        SUPublicEDKey: SRLHhBqtlIsBvuqpk/ONBFaAS629idQVYwoebgfGd/E=
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
        SUScheduledCheckInterval: 86400
        EVReleaseDate: $(EVAULT_RELEASE_DATE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.dinhkhanh.evault
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 15
        # Date this version shipped; licenses whose updatesUntil is earlier run as Free on this build.
        EVAULT_RELEASE_DATE: "2026-10-15"
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: false
        DEAD_CODE_STRIPPING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Unsigned local builds: folder sync only, no iCloud entitlements.
        CODE_SIGN_ENTITLEMENTS: App/eVault.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
      configs:
        # Signed builds: iCloud/CloudKit + push entitlements. Team id comes from Config/Signing.xcconfig.
        Debug-iCloud:
          CODE_SIGN_ENTITLEMENTS: App/eVault-iCloud.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(EVAULT_TEAM_ID)"
          EVAULT_APS_ENVIRONMENT: development
        Release-iCloud:
          CODE_SIGN_ENTITLEMENTS: App/eVault-iCloud.entitlements
          CODE_SIGN_STYLE: Automatic
          # Automatic signing archives with Apple Development; the export (method developer-id) re-signs with Developer ID.
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(EVAULT_TEAM_ID)"
          EVAULT_APS_ENVIRONMENT: production
  # Named evault-cli, not evault: the case-insensitive disk would merge its build folders with eVault's.
  evault-cli:
    type: tool
    platform: macOS
    sources:
      - path: Packages/eVaultKit/Sources/evault
    dependencies:
      - package: eVaultKit
        product: VaultCore
      - package: eVaultKit
        product: EnvKit
    configFiles:
      Debug-iCloud: Config/Signing.xcconfig
      Release-iCloud: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: evault
        PRODUCT_BUNDLE_IDENTIFIER: dk.dinhkhanh.evault.cli
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
        DEAD_CODE_STRIPPING: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # An embedded Info.plist gives the tool a stable signing identifier. No sandbox, no entitlements.
        CREATE_INFOPLIST_SECTION_IN_BINARY: true
        GENERATE_INFOPLIST_FILE: true
      configs:
        Debug-iCloud:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(EVAULT_TEAM_ID)"
        Release-iCloud:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(EVAULT_TEAM_ID)"
schemes:
  eVault:
    build:
      targets:
        eVault: all
    run:
      config: Debug
  eVault-iCloud:
    build:
      targets:
        eVault: all
    run:
      config: Debug-iCloud
    archive:
      config: Release-iCloud
